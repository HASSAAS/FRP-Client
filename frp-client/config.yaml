name: "FRP Client"
description: "Expose Home Assistant through FRP with HTTP or HTTPS"
version: "2.1.1"
slug: "frp_client"
url: "https://github.com/HASSAAS/FRP-Client"
host_network: true
startup: application
boot: "auto"
init: false
map:
  - type: share
    read_only: false
  - type: ssl
    read_only: true
privileged:
  - NET_ADMIN
devices:
  - /dev/net/tun
arch:
  - aarch64
  - amd64
breaking_versions:
  - "2.0.0"
options:
  serverAddr: null
  serverPort: 7000
  authToken: null
  webServerPort: 7500
  webServerUser: "admin"
  webServerPassword: null
  customDomain: null
  proxyName: "homeassistant"
  proxyType: "http"
  localIP: "127.0.0.1"
  localPort: 8123
  certificateFile: "/ssl/fullchain.pem"
  privateKeyFile: "/ssl/privkey.pem"
  hostHeaderRewrite: "127.0.0.1"
schema:
  serverAddr: str
  serverPort: port
  authToken: password
  webServerPort: port
  webServerUser: str
  webServerPassword: password
  customDomain: str
  proxyName: str
  proxyType: list(http|https)
  localIP: str
  localPort: port
  certificateFile: str
  privateKeyFile: str
  hostHeaderRewrite: str
