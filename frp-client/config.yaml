name: "FRP Client"
description: "You can use this tool to achieve remote access to local Home Assistant OS by port forwarding"
version: "2.0.0"
slug: "frp_client"
url: "https://github.com/HASSAAS/FRP-Client"
host_network: true
startup: application
boot: "auto"
init: false
map:
  - type: share
    read_only: false
privileged:
  - NET_ADMIN
devices:
  - /dev/net/tun
arch:
  - aarch64
  - amd64
breaking_versions:
  - "2.0.0"
options:
  serverAddr: null
  serverPort: 7000
  authToken: null
  webServerPort: 7500
  webServerUser: "admin"
  webServerPassword: null
  customDomain: null
  proxyName: "homeassistant"
schema:
  serverAddr: str
  serverPort: port
  authToken: password
  webServerPort: port
  webServerUser: str
  webServerPassword: password
  customDomain: str
  proxyName: str
